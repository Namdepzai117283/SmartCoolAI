<!-- ============ ĐĂNG NHẬP ============ -->
<section id="login" class="login" hidden>
  <form class="glass login-card" id="loginForm" autocomplete="on">
    <div class="brand big"><span class="logo"><svg class="i"><use href="#snow"/></svg></span><div><b>SmartCool</b><small>Bảng quản trị</small></div></div>
    <h1>Đăng nhập quản trị</h1>
    <p class="muted">Dành cho Super Admin, quản lý kho, chăm sóc khách hàng và kỹ thuật viên.</p>
    <label>Email<input name="email" type="email" required placeholder="admin@smartcool.vn" autocomplete="username"></label>
    <label>Mật khẩu<input name="password" type="password" required placeholder="••••••••" autocomplete="current-password"></label>
    <button class="btn primary wide" type="submit"><svg class="i"><use href="#lock"/></svg>Đăng nhập</button>
    <div class="or" id="googleOr" hidden><span>hoặc</span></div>
    <div id="googleBtn" class="google-slot"></div>
    <p class="hint" id="googleHint" hidden>Đăng nhập Google chưa bật: server chưa có <code>GOOGLE_CLIENT_ID</code>.</p>
    <p class="error" id="loginError" role="alert"></p>
  </form>
</section>

<!-- ============ ỨNG DỤNG ============ -->
<div id="app" class="shell" hidden>
  <aside class="side glass" id="side">
    <div class="brand"><span class="logo"><svg class="i"><use href="#snow"/></svg></span><div><b>SmartCool</b><small>Admin</small></div></div>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Mở menu"><svg class="i"><use href="#menu"/></svg></button>
      <div><h2 id="pageTitle">Tổng quan</h2><p class="muted small" id="pageSub"></p></div>
      <div class="top-actions"><button class="icon-btn" id="reloadBtn" title="Tải lại"><svg class="i"><use href="#refresh"/></svg></button></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<!-- Ngăn kéo chi tiết + hộp thoại -->
<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer glass" id="drawer" hidden><button class="icon-btn close" id="drawerClose" aria-label="Đóng"><svg class="i"><use href="#x"/></svg></button><div id="drawerBody"></div></aside>
<dialog id="modal" class="glass modal"><form method="dialog" id="modalForm"></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
