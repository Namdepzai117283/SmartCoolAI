# PostgreSQL cho máy cá nhân: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcool
      POSTGRES_PASSWORD: smartcool
      POSTGRES_DB: smartcool_ai
    ports:
      - "5432:5432"
    volumes:
      - smartcool_pgdata:/var/lib/postgresql/data

volumes:
  smartcool_pgdata:
